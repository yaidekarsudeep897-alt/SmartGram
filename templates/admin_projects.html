{% extends 'base.html' %}{% block title %}Manage Projects{% endblock %}{% block content %}<div class="heading"><div><div class="eyebrow">ADMINISTRATION</div><h1>Development projects</h1><p>Add village development work and show progress.</p></div></div><div class="formcard"><form method="post"><div class="twocol"><div><label>Name</label><input class="input" name="name" required></div><div><label>Location</label><input class="input" name="location"></div></div><label>Description</label><textarea class="input" name="description"></textarea><div class="twocol"><div><label>Budget</label><input class="input" type="number" name="budget"></div><div><label>Progress %</label><input class="input" type="number" name="progress" min="0" max="100" value="0"></div></div><div class="twocol"><div><label>Start</label><input class="input" type="date" name="start_date"></div><div><label>End</label><input class="input" type="date" name="end_date"></div></div><label>Status</label><select class="input" name="status"><option>Planned</option><option>In Progress</option><option>Completed</option></select><button class="greenbtn">Add project</button></form></div>{% endblock %}
