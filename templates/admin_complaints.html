{% extends 'base.html' %}{% block title %}Manage Complaints{% endblock %}{% block content %}<div class="heading"><div><div class="eyebrow">ADMINISTRATION</div><h1>Complaint management</h1><p>Assign officers and update complaint status.</p></div></div>{% for x in rows %}<div class="card admincase"><div class="casehead"><div><small>#{{x.id}} · {{x.citizen}}</small><h3>{{x.title}}</h3><p>{{x.description}}</p></div><em>{{x.status}}</em></div><form method="post" class="twocol"><input type="hidden" name="id" value="{{x.id}}"><div><label>Status</label><select class="input" name="status">{% for s in ['Pending','Assigned','In Progress','Completed','Rejected'] %}<option {% if x.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></div><div><label>Officer</label><select class="input" name="assigned_to"><option value="">-- Select --</option>{% for o in officers %}<option value="{{o.id}}" {% if x.assigned_to==o.id %}selected{% endif %}>{{o.name}}</option>{% endfor %}</select></div><div><label>Note</label><input class="input" name="note" value="{{x.note or ''}}"></div><div class="end"><button class="greenbtn">Save update</button></div></form></div>{% endfor %}{% endblock %}
