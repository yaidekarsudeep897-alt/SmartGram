{% extends 'base.html' %}{% block title %}Report Problem{% endblock %}{% block content %}<div class="heading"><div><div class="eyebrow">CITIZEN SERVICE</div><h1>Report a village problem</h1><p>Give enough detail so the right officer can act quickly.</p></div></div><div class="formcard"><form method="post" enctype="multipart/form-data"><h3>Problem details</h3><label>Short title</label><input class="input" name="title" required placeholder="Broken street light near school"><label>Description</label><textarea class="input" name="description" rows="5" required placeholder="Explain the problem clearly..."></textarea><div class="twocol"><div><label>Category</label><select class="input" name="category"><option value="Auto">Smart suggestion from description</option>{% for c in categories %}<option>{{c}}</option>{% endfor %}</select></div><div><label>Priority</label><select class="input" name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select></div></div><label>Location / landmark</label><input class="input" name="location" placeholder="Near Government School"><label>Photo (optional)</label><input class="input" type="file" name="image" accept=".jpg,.jpeg,.png,.webp"><button class="greenbtn">Submit complaint</button></form></div>{% endblock %}
